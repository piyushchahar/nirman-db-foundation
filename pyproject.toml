[project]
name = "nirman-db-foundation"
version = "0.1.0"
description = "TASK-DB-FOUNDATION-001: Nirman PostgreSQL database foundation."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "PyJWT>=2.8,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "redis>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-postgresql>=6.0,<7.0",
    "psycopg[binary]>=3.0,<4.0",
    "black>=24.0,<25.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2.0",
]

[tool.black]
line-length = 95
target-version = ["py311"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["backend/alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
